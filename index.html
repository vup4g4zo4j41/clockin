<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CityGo</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --ground:   #F4F7F9;
    --surface:  #FFFFFF;
    --ink:      #16202A;
    --ink-2:    #5A6B77;
    --muted:    #8A9AA6;
    --rule:     #DDE4E9;
    --accent:   #1F5E6B;
    --accent-d: #164851;
    --accent-soft: #E6EDF0;
    --ok:       #2E7D5B;
    --ok-soft:  #E4F1EA;
    --warn:     #B87A1E;
    --warn-soft:#F8EFDE;
    --crit:     #B3453A;
    --crit-soft:#F8E6E4;
    --sans: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── 畫面切換 ── */
  .screen { display: none; flex: 1; flex-direction: column; padding: 1.25rem 1.25rem 1.5rem; gap: 1rem; }
  .screen.active { display: flex; }

  /* ── 載入中 ── */
  #screen-loading { align-items: center; justify-content: center; gap: 1rem; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 今日御神籤（上班打卡後的小彩蛋，不記錄任何資料） ── */
  /* 字型：思源宋體（Noto Serif TC，SIL 開放授權），只抽出籤上用到的字，每個粗細約 68 KB。
     籤的內容有改字時，要重新抽字型，不然新字會顯示成系統字。
     配色：城市健身品牌橘 #EA5326 */
  @font-face { font-family: 'Omikuji'; src: url('fonts/omikuji-serif-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Omikuji'; src: url('fonts/omikuji-serif-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Omikuji'; src: url('fonts/omikuji-serif-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
  .omikuji {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(12, 18, 24, 0.55); padding: 16px;
  }
  .omikuji.open { display: flex; }
  /* 籤筒：籤棒先畫、筒身後畫，籤棒就像從筒子後面冒出來 */
  .omi-tube { position: relative; width: 72px; height: 150px; animation: omi-shake 0.9s ease-in-out; }
  .omi-tube-stick {
    position: absolute; top: 0; left: 31px; width: 10px; height: 60px;
    background: #F3E3CF; border-radius: 3px; animation: omi-stick 0.9s ease-in-out forwards;
  }
  .omi-tube-body {
    position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
    border-radius: 10px 10px 16px 16px; background: linear-gradient(#EA5326, #C4431B);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    color: #FFFFFF; font-family: 'Omikuji', serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.15em;
    writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center;
  }
  @keyframes omi-shake {
    0%, 100% { transform: rotate(0); } 15% { transform: rotate(-14deg); } 35% { transform: rotate(12deg); }
    55% { transform: rotate(-10deg); } 75% { transform: rotate(8deg); }
  }
  @keyframes omi-stick { 0%, 70% { transform: translateY(30px); } 100% { transform: translateY(0); } }
  .omi-card {
    display: none; width: 100%; max-width: 320px;
    background: #FFFCF9; color: #2B2522; font-family: 'Omikuji', serif; font-weight: 500;
    border: 2px solid #EA5326; outline: 6px solid #FFFCF9; outline-offset: -10px;
    border-radius: 6px; padding: 1.6rem 1.4rem 1.3rem; text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    animation: omi-pop 0.45s cubic-bezier(.2,1.4,.4,1);
  }
  .omikuji.revealed .omi-tube { display: none; }
  .omikuji.revealed .omi-card { display: block; }
  @keyframes omi-pop { from { transform: scale(0.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .omi-head { font-size: 0.85rem; letter-spacing: 0.35em; color: #C4431B; }
  /* 運勢大字用往右下偏移的陰影，像蓋上去的印，不用發光 */
  .omi-rank {
    font-size: 3.2rem; font-weight: 900; letter-spacing: 0.25em; color: #EA5326;
    margin: 0.4rem 0 0.6rem; padding-left: 0.25em;
    text-shadow: 3px 3px 0 rgba(43, 37, 34, 0.18);
  }
  .omi-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.35rem; }
  .omi-text { font-size: 1.02rem; line-height: 1.6; color: #5C504A; }
  .omi-wish { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px dashed #F2C2AE; font-size: 0.98rem; color: #7A6A62; }
  .omi-btn {
    margin-top: 1.1rem; width: 100%; padding: 0.8rem; border: none; border-radius: 10px;
    background: #EA5326; color: #FFFFFF; font-family: inherit; font-size: 1.05rem; font-weight: 700;
    box-shadow: 0 3px 0 #C4431B;
  }
  @media (prefers-reduced-motion: reduce) {
    .omi-tube, .omi-tube-stick, .omi-card { animation: none; }
  }

  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  .loading-text { color: var(--ink-2); font-size: 0.95rem; }

  /* ── 頁首 ── */
  .header { display: flex; flex-direction: column; gap: 0.15rem; padding-top: 0.5rem; }
  .header .name { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .header .sub { font-size: 0.9rem; color: var(--ink-2); }

  /* ── 卡片 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 1rem 1.15rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .card-label {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-family: var(--mono);
  }

  .shift-time { font-size: 1.15rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .shift-name { font-size: 0.88rem; color: var(--ink-2); }

  /* ── 待審假單提醒（只有主管看得到） ── */
  .leave-alert {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    font-size: 0.92rem; font-weight: 600;
    background: var(--warn-soft); color: var(--warn);
    text-decoration: none;
  }
  .leave-alert .txt { flex: 1; }

  .notify-card .notify-desc { font-size: 0.9rem; color: var(--ink-2); }

  /* ── 每月咖啡抽獎：只有中獎的人看得到（活動不公開，要像意外的驚喜） ── */
  .coffee-alert {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1rem; border-radius: 10px;
    font-size: 0.92rem; font-weight: 600; line-height: 1.45;
    background: #FDEDE6; color: #A8381A;
  }
  .coffee-win-card {
    width: 100%; max-width: 320px; text-align: center;
    background: #FFFCF9; color: #2B2522;
    border: 2px solid #EA5326; outline: 6px solid #FFFCF9; outline-offset: -10px;
    border-radius: 6px; padding: 1.6rem 1.4rem 1.3rem;
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    animation: omi-pop 0.45s cubic-bezier(.2,1.4,.4,1);
  }
  .cw-cup { font-size: 3rem; line-height: 1; }
  .cw-head { margin-top: 0.5rem; font-size: 0.85rem; letter-spacing: 0.35em; color: #C4431B; font-weight: 700; }
  .cw-title { margin-top: 0.5rem; font-size: 1.25rem; font-weight: 800; line-height: 1.4; }
  .cw-text { margin-top: 0.5rem; font-size: 0.98rem; line-height: 1.6; color: #5C504A; white-space: pre-line; }
  @media (prefers-reduced-motion: reduce) { .coffee-win-card { animation: none; } }
  .notify-card .notify-code { font-size: 0.88rem; color: var(--ink-2); }

  /* ── 定位狀態 ── */
  .locate {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    font-size: 0.92rem;
    background: var(--surface);
    border: 1px solid var(--rule);
  }
  .locate.ok   { background: var(--ok-soft);   border-color: transparent; color: var(--ok); }
  .locate.far  { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .locate.fail { background: var(--crit-soft); border-color: transparent; color: var(--crit); }
  .locate .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .locate .txt { flex: 1; }
  .locate .m { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ── 主按鈕 ── */
  .punch-btn {
    margin-top: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 1.5rem;
    font-family: inherit;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .punch-btn:active:not(:disabled) { transform: scale(0.985); background: var(--accent-d); }
  .punch-btn:disabled { background: #B8C4CB; cursor: not-allowed; }
  .punch-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .punch-hint { text-align: center; font-size: 0.82rem; color: var(--muted); margin-top: 0.6rem; }

  /* ── 今日紀錄 ── */
  .today { display: flex; flex-direction: column; gap: 0.4rem; }
  .today-row {
    display: flex; align-items: baseline; gap: 0.7rem;
    font-size: 0.92rem;
    padding: 0.35rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .today-row:last-child { border-bottom: none; }
  .today-row .t { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  .today-row .k { color: var(--ink-2); }
  .today-row .v { margin-left: auto; font-size: 0.8rem; }

  .tag { padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
  .tag.ok   { background: var(--ok-soft);   color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.crit { background: var(--crit-soft); color: var(--crit); }
  .tag.info { background: var(--accent-soft); color: var(--accent); }
  .tag.mute { background: var(--accent-soft); color: var(--muted); }

  /* ── 結果畫面 ── */
  #screen-result { align-items: center; justify-content: center; text-align: center; gap: 0.5rem; }
  .result-icon { font-size: 3.5rem; line-height: 1; }
  .result-time { font-size: 2.6rem; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .result-type { font-size: 1.2rem; font-weight: 650; }
  .result-msg  { font-size: 0.95rem; color: var(--ink-2); max-width: 18rem; }
  .result-hours {
    margin-top: 0.75rem;
    padding: 0.7rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    font-size: 0.9rem;
  }
  .result-hours b { font-family: var(--mono); font-size: 1.05rem; }

  /* ── 錯誤 ── */
  .error-box {
    background: var(--crit-soft);
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .error-box .t { font-weight: 700; color: var(--crit); }
  .error-box .d { font-size: 0.9rem; color: var(--ink-2); }

  /* ── 次要按鈕 ── */
  .btn {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 0.85rem 1.25rem;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: var(--ground); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-row { display: flex; gap: 0.6rem; }
  .btn-row .btn { flex: 1; }

  /* ── 表單（註冊用） ── */
  .field { display: flex; flex-direction: column; gap: 0.35rem; }
  .field label { font-size: 0.85rem; color: var(--ink-2); font-weight: 600; }
  .field input {
    font-family: inherit;
    font-size: 1rem;
    padding: 0.8rem 0.9rem;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .field .hint { font-size: 0.78rem; color: var(--muted); }

  .confirm-box {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex; flex-direction: column; gap: 0.7rem;
  }
  .confirm-row { display: flex; justify-content: space-between; align-items: baseline; }
  .confirm-row .k { font-size: 0.85rem; color: var(--ink-2); }
  .confirm-row .v { font-size: 1.05rem; font-weight: 650; }

  /* ── 紀錄列表 ── */
  .summary {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  }
  .summary div { background: var(--surface); padding: 0.9rem 1rem; }
  .summary .k { font-size: 0.75rem; color: var(--muted); }
  .summary .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  .log { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .log-row { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 0.6rem; align-items: center; padding: 0.8rem 1rem; border-bottom: 1px solid var(--rule); }
  .log-row:last-child { border-bottom: none; }
  .log-row .d { font-family: var(--mono); font-size: 0.85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .log-row .t { font-family: var(--mono); font-size: 0.92rem; font-variant-numeric: tabular-nums; }
  .log-row .h { font-size: 0.85rem; color: var(--ink-2); text-align: right; }

  .empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 2.5rem 1rem; }

  .leave-side { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
  .withdraw-btn {
    background: none; border: 1px solid var(--rule); border-radius: 8px;
    padding: 0.3rem 0.7rem; font-family: inherit; font-size: 0.82rem; color: var(--ink-2);
  }
  .withdraw-btn:disabled { opacity: 0.5; }

  /* ── 請假 ── */
  .field select {
    font-family: inherit; font-size: 1rem;
    padding: 0.8rem 0.9rem;
    border: 1px solid var(--rule); border-radius: 10px;
    background: var(--surface); color: var(--ink);
    appearance: none;
  }
  .field select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

  /* 特休、病假這些有額度的假別，剩多少一眼看到 */
  .balance {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 1px; background: var(--rule);
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  }
  .balance:empty { display: none; }
  .balance div {
    background: var(--surface); padding: 0.8rem 0.5rem; text-align: center;
    display: flex; flex-direction: column; justify-content: center; gap: 0.1rem;
  }
  /* 標籤鎖住兩行高度，某一格折行時數字才不會被推歪 */
  .balance .k { font-size: 0.72rem; color: var(--muted); line-height: 1.3; min-height: 1.9em; }
  .balance .k:last-child { min-height: 0; }
  .balance .v { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  .section-title { font-size: 0.85rem; color: var(--ink-2); font-weight: 650; margin-top: 0.4rem; }

  /* ── 我的班表 ── */
  .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .month-nav button {
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    padding: 0.5rem 0.8rem; border: 1px solid var(--rule); border-radius: 8px;
    background: var(--surface); color: var(--ink-2); cursor: pointer;
  }
  .month-nav span { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  #shifts-log .log-row { grid-template-columns: 3.4rem 1fr auto; }
  #shifts-log .t { display: flex; align-items: baseline; gap: 0.3rem; font-size: 1.05rem; font-weight: 700; }
  #shifts-log .t .wd { font-size: 0.75rem; font-weight: 500; color: var(--muted); font-family: var(--sans); }
  .shift-name { font-weight: 650; }
  /* 今天那列要一眼認出來，不然員工得自己數到第幾行 */
  .log-row.is-today { background: var(--accent-soft); }

  /* 請整天 / 指定時段 */
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .seg button {
    flex: 1; font-family: inherit; font-size: 0.92rem; font-weight: 600;
    padding: 0.7rem 0.5rem; border: none; background: var(--surface);
    color: var(--ink-2); cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; }

  .msg { font-size: 0.88rem; padding: 0.7rem 0.9rem; border-radius: 10px; line-height: 1.5; }
  .msg.ok    { background: var(--ok-soft);   color: var(--ok); }
  .msg.error { background: var(--crit-soft); color: var(--crit); }

  /* ── 底部分頁 ── */
  .tabs {
    display: flex; border-top: 1px solid var(--rule);
    background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs button {
    flex: 1; background: none; border: none;
    padding: 0.9rem 0.5rem; font-family: inherit; font-size: 0.85rem;
    color: var(--muted); cursor: pointer; font-weight: 600;
    border-top: 2px solid transparent; margin-top: -1px;
  }
  .tabs button.active { color: var(--accent); border-top-color: var(--accent); }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground:   #10171C;
      --surface:  #172129;
      --ink:      #E6EDF2;
      --ink-2:    #A0B0BC;
      --muted:    #7A8B98;
      --rule:     #26343E;
      --accent:   #6FBCCB;
      --accent-d: #8ACEDB;
      --ok:       #5FBF92;
      --ok-soft:  #14312A;
      --warn:     #E0A64A;
      --warn-soft:#33280F;
      --crit:     #E07A6E;
      --crit-soft:#351E1C;
      --accent-soft: #1C2E36;
    }
    .punch-btn { color: #0C1418; }
    .btn.primary { color: #0C1418; }
    .punch-btn:disabled { background: #3A4A55; color: #7A8B98; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- 載入中 -->
  <div class="screen active" id="screen-loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">載入中…</div>
  </div>

  <!-- 打卡主畫面 -->
  <div class="screen" id="screen-punch">
    <div class="header">
      <div class="name" id="punch-name">—</div>
      <div class="sub" id="punch-sub">—</div>
    </div>

    <a class="leave-alert" id="leave-alert" style="display:none">
      <span class="txt" id="leave-alert-text"></span>
      <span>→</span>
    </a>

    <div class="coffee-alert" id="coffee-alert" style="display:none">
      <span>🎉</span><span id="coffee-alert-text"></span>
    </div>

    <div class="card notify-card" id="notify-card" style="display:none">
      <div class="card-label">請假通知</div>
      <div class="notify-desc">店裡有人送假單時，CITYGO 官方帳號會傳 LINE 通知你</div>
      <button class="btn" id="notify-btn">🔔 開啟請假通知</button>
      <div class="notify-code" id="notify-code" style="display:none"></div>
    </div>

    <div class="card" id="shift-card">
      <div class="card-label">今日班表</div>
      <div class="shift-time" id="shift-time">—</div>

<script>
// ─────────────────────────────────────────────
// 設定：部署時填入這兩個值
// ─────────────────────────────────────────────
const CONFIG = {
  LIFF_ID: '2011083590-EXsGOSUJ',
  ADMIN_URL: 'https://vup4g4zo4j41.github.io/clockin/admin.html',
  OA_ID: '@579ltvmm',   // 官方帳號「CITYGO打卡系統」，店長傳綁定碼給它開啟請假通知
  API_URL: 'https://btjrsiusaqoldwvkebfv.supabase.co/functions/v1/api?forceFunctionRegion=ap-southeast-1',
};

// ─────────────────────────────────────────────
// 版本檢查：LINE 內建瀏覽器常拿手機裡存的舊網頁出來用。
// 打開時先問 version.json 最新版是哪一版，比自己舊就換新網址重新載入
// （網址多一個 v=版本，手機就不會再拿舊的）。每次上線要同時改這裡和 version.json。
// ─────────────────────────────────────────────
const PAGE_VERSION = '20261024a';

async function ensureLatestPage() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(function () { ctrl.abort(); }, 3000);
    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timer);
    const latest = String((await res.json()).version || '');
    const url = new URL(location.href);
    // 已經帶著最新版號還是舊頁面，就不再重整，避免無限重新載入
    if (!latest || latest === PAGE_VERSION || url.searchParams.get('v') === latest) return false;
    // LINE 登入回來的一次性參數不能帶著重整，否則重新登入會失敗
    ['code', 'state', 'liffClientId', 'liffRedirectUri'].forEach(function (k) { url.searchParams.delete(k); });
    url.searchParams.set('v', latest);
    location.replace(url.toString());
    return true;
  } catch (e) {
    return false;   // 查不到就照常使用，不能因為這個擋住打卡
  }
}


// ─────────────────────────────────────────────
// 與後端溝通
//
// Content-Type 用 text/plain 是刻意的：Apps Script 不回應 CORS 預檢請求，
// 換成 application/json 會觸發預檢而失敗。內容本身仍是 JSON。
// ─────────────────────────────────────────────
async function api(action, params, attempt) {
  attempt = attempt || 1;

  // Apps Script 的轉址偶爾會掉（表現為 404）。查詢類的自動重試，
  // 但打卡本身不重試——萬一是回應遺失而非請求失敗，重試會打成兩筆。
  // get 與 list 開頭的都是唯讀動作，重試不會產生副作用。
  const canRetry = /^(get|list)/.test(action) && attempt < 3;

  // fetch 本身沒有逾時。行動網路訊號不穩時連線會一直掛著不回應，
  // 畫面就永遠停在「載入中」——寧可失敗給個明確訊息，也不要無限等待。
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, 25000);

  let response;
  try {
    response = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, params || {})),
      redirect: 'follow',
      signal: controller.signal,
    });
  } catch (netErr) {
    if (canRetry) {
      await new Promise(function (r) { setTimeout(r, 600 * attempt); });
      return api(action, params, attempt + 1);
    }
    throw new Error(netErr.name === 'AbortError'
      ? '等太久沒有回應，請確認網路訊號後再試一次'
      : '連線中斷，請確認網路後再試一次');
  } finally {
    clearTimeout(timer);
  }

  if (!response.ok) {
    if (canRetry) {
      await new Promise(function (r) { setTimeout(r, 600 * attempt); });
      return api(action, params, attempt + 1);
    }
    throw new Error('連線失敗（' + response.status + '），請再按一次');
  }

  const result = await response.json();
  if (!result.ok) {
    const err = new Error(result.error || '發生未知錯誤');
    err.code = result.code;
    throw err;
  }
  return result.data;
}

// ─────────────────────────────────────────────
// 畫面切換
// ─────────────────────────────────────────────
function show(id) {

    el.classList.toggle('active', el.id === 'screen-' + id);

// ─────────────────────────────────────────────
// 定位
// ─────────────────────────────────────────────
let currentPosition = null;
let punchPoints = [];   // 這間店的所有打卡點，任一在範圍內就能打卡

function requestLocation() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) {
      reject(new Error('這支手機不支援定位功能'));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
        });
      },
      function (err) {
        const messages = {
          1: '你拒絕了定位權限。請到手機設定開啟 LINE 的定位權限後重試',
          2: '目前抓不到位置訊號，請走到門口或窗邊再試一次',
          3: '定位逾時，請走到訊號好一點的位置再試一次',
        };
        reject(new Error(messages[err.code] || '定位失敗，請再試一次'));
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

/** 兩點距離（公尺）。前端只用來即時顯示，實際判定以後端為準。 */
function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = function (d) { return d * Math.PI / 180; };
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

/**
 * 找出離現在位置最近的打卡點。
 * 已經進到範圍內的點優先，其次才比距離——否則站在貳館門口
 * 卻因為本館「數字上更近」而被說超出範圍。
 */
function nearestPoint(points, pos) {
  let best = null;

  points.forEach(function (p) {
    const d = distanceMeters(pos.lat, pos.lng, p.lat, p.lng);
    const within = d <= p.radius;

    if (!best ||
        (within && !best.within) ||
        (within === best.within && d < best.distance)) {
      best = { point: p, distance: d, within: within };
    }
  });

  return best;
}

function updateLocateUI(state, text) {
  const el = document.getElementById('locate');
  el.className = 'locate' + (state ? ' ' + state : '');
  document.getElementById('locate-text').innerHTML = text;
}

async function locate() {
  const btn = document.getElementById('punch-btn');
  btn.disabled = true;
  btn.textContent = '定位中…';
  updateLocateUI('', '定位中…');

  try {
    currentPosition = await requestLocation();

    if (punchPoints.length) {
      const near = nearestPoint(punchPoints, currentPosition);
      const label = near.point.名稱 || venueName;

      if (near.within) {
        updateLocateUI('ok', '距離' + label + ' <span class="m">' + near.distance + '</span> 公尺');
        btn.disabled = false;
        btn.textContent = nextAction + '打卡';
        document.getElementById('punch-hint').textContent = '';
      } else {
        updateLocateUI('far', '距離' + label + ' <span class="m">' + near.distance + '</span> 公尺，超出範圍');
        btn.disabled = true;
        btn.textContent = '不在打卡範圍內';
        document.getElementById('punch-hint').textContent =
          label + '的打卡範圍為 ' + near.point.radius + ' 公尺內。' +
          (punchPoints.length > 1 ? '（已比對這間店的 ' + punchPoints.length + ' 個打卡點）' : '') +
          '若你人在店裡卻顯示超出範圍，請聯繫主管';
      }
    } else {
      updateLocateUI('ok', '已取得定位');
      btn.disabled = false;
      btn.textContent = nextAction + '打卡';
    }
  } catch (err) {
    currentPosition = null;
    updateLocateUI('fail', err.message);
    btn.disabled = true;
    btn.textContent = '無法定位';
    document.getElementById('punch-hint').textContent = '若重試多次都失敗，請聯繫主管協助補登';
  }
}

const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

    }).join('');

  // 有人送假單，店長打卡時就會看到，不必特地開後台

function verdictTag(verdict) {
  const map = {
    '準時': 'ok', '遲到': 'warn', '早退': 'warn',
    '未排班出勤': 'info', '請假': 'info',
  };
  return '<span class="tag ' + (map[verdict] || 'info') + '">' + verdict + '</span>';
}

async function doPunch() {
  const btn = document.getElementById('punch-btn');
  btn.disabled = true;
  btn.textContent = '打卡中…';

  try {
    const result = await api('punch', { idToken: idToken, location: currentPosition });

    document.getElementById('result-icon').textContent = '✓';
    document.getElementById('result-time').textContent = result.時間;
    document.getElementById('result-type').textContent = result.類型 + '打卡完成';
    // 一間店有多個打卡點時，把實際打在哪裡講清楚，員工才知道系統認的是哪一館
    document.getElementById('result-msg').textContent =
      [result.地點, result.訊息].filter(Boolean).join(' · ');

    const hoursEl = document.getElementById('result-hours');
    if (result.類型 === '下班' && result.今日時數) {
      hoursEl.innerHTML = '今日工時 <b>' + result.今日時數.顯示 + '</b>';
      hoursEl.style.display = '';
    } else {
      hoursEl.style.display = 'none';
    }

/** 字串 → 固定的整數（FNV-1a），同樣的人＋日期永遠得到同樣的籤。 */
function omikujiHash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h;
}

function drawOmikuji(empId, date) {
  const seed = omikujiHash(String(empId) + '|' + date);
  const roll = seed % 100;
  const rank = roll < 20 ? '大吉' : roll < 60 ? '中吉' : '小吉';
  const list = OMIKUJI[rank];
  const pick = list[omikujiHash(date + '#' + empId) % list.length];
  return { rank: rank, title: pick[0], text: pick[1] };
}

function showOmikuji(ctx) {
  if (!ctx || !ctx.員工編號 || !ctx.日期) return;
  const o = drawOmikuji(ctx.員工編號, ctx.日期);
  // 用英文名（Chris）比較親切；姓名欄存的就是英文名
  const name = String(ctx.姓名 || '').trim();

  document.getElementById('omi-rank').textContent = o.rank;
  document.getElementById('omi-title').textContent = o.title;
  document.getElementById('omi-text').textContent = o.text;
  document.getElementById('omi-wish').textContent = '祝 ' + name + ' 今天上班順利 ✨';

  const box = document.getElementById('omikuji');

  box.classList.add('open');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

}

/**
 * 一間店可以有好幾個打卡點（景安店的本館與貳館）。
 * 每個點各自設半徑——工作室三十坪，跟兩百八十坪的南華不該用同一個容忍範圍。
 */
function renderSetupStores(stores) {
  const container = document.getElementById('setup-venues');

  container.innerHTML = stores.map(function (s) {
    const points = s.打卡點 || [];

    const rows = points.length
      ? points.map(function (p) {
          let status;
          if (!p.已設定座標) {
            status = '<span style="color:var(--crit)">尚未設定座標</span>';
          } else if (setupPosition) {
            const d = distanceMeters(setupPosition.lat, setupPosition.lng, p.緯度, p.經度);
            status = '<span style="color:' + (d <= p.允許半徑 ? 'var(--ok)' : 'var(--ink-2)') +
                     '">距離 ' + d + ' 公尺</span>';
          } else {
            status = '<span style="color:var(--ink-2)">已設定</span>';
          }

          return '<div class="log-row" style="grid-template-columns:1fr auto">' +
            '<div><div style="font-weight:650">' + esc(p.名稱) + '</div>' +
            '<div style="font-size:0.8rem">' + status + ' · 半徑 ' + p.允許半徑 + ' 公尺</div></div>' +
            '<button class="btn" data-point="' + esc(p.點位代碼) +
            '" data-store="' + esc(s.店代碼) + '" data-name="' + esc(p.名稱) +
            '" data-radius="' + p.允許半徑 +
            '" style="padding:0.5rem 0.8rem; font-size:0.85rem">設為此處</button>' +
            '</div>';
        }).join('')
      : '<div class="log-row" style="font-size:0.85rem; color:var(--ink-2)">' +
        '這間店還沒有打卡點</div>';

    return '<div style="margin-bottom:1.1rem">' +
      '<div style="font-weight:700; margin-bottom:0.35rem">' + esc(s.店名) + '</div>' +
      rows +
      '<button class="btn" data-add="' + esc(s.店代碼) + '" data-store-name="' + esc(s.店名) +
      '" style="margin-top:0.4rem; padding:0.5rem 0.8rem; font-size:0.85rem">' +
      '＋ 在這裡新增打卡點</button>' +
      '</div>';
  }).join('');

  container.querySelectorAll('button[data-point]').forEach(function (btn) {
    btn.addEventListener('click', function () { updatePointHere(btn); });
  });
  container.querySelectorAll('button[data-add]').forEach(function (btn) {
    btn.addEventListener('click', function () { addPointHere(btn); });
  });
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/** 詢問半徑。取消回傳 null，代表沿用原本的設定。 */
function askRadius(current) {
  const input = prompt(
    '打卡範圍半徑（公尺）\n\n' +
    '手機定位在室內通常有 20 到 50 公尺誤差，設太小人在店裡也會打不到卡。\n' +
    '小工作室建議 50，一般店面 80，大坪數 100。',
    String(current || 80)
  );
  if (input === null) return null;

  const n = Number(input);
  if (!n || n < 20 || n > 200) {
    alert('半徑請填 20 到 200 之間的數字');
    return undefined;   // 明確表示輸入無效，呼叫端要中止
  }
  return n;
}

async function updatePointHere(btn) {
  if (!setupPosition) {
    document.getElementById('setup-hint').textContent = '還沒取得定位，請先允許位置權限再試';
    return;
  }

  const name = btn.dataset.name;
  if (!confirm('要把「' + name + '」的座標改成你現在的位置嗎？\n\n原本的設定會被覆蓋。')) return;

  const radius = askRadius(btn.dataset.radius);
  if (radius === undefined) return;

  await savePoint(btn, {
    storeCode: btn.dataset.store,
    pointCode: btn.dataset.point,
    location: setupPosition,
    radius: radius,
  }, '設為此處');
}

async function addPointHere(btn) {
  if (!setupPosition) {
    document.getElementById('setup-hint').textContent = '還沒取得定位，請先允許位置權限再試';
    return;
  }

  const storeName = btn.dataset.storeName;
  const name = prompt(
    '這個打卡點叫什麼？\n\n取好認的名字，員工打卡成功時會看到。',
    storeName
  );
  if (name === null || !name.trim()) return;

  const radius = askRadius(80);
  if (radius === undefined) return;

  await savePoint(btn, {
    storeCode: btn.dataset.add,
    name: name.trim(),
    location: setupPosition,
    radius: radius,
  }, '＋ 在這裡新增打卡點');
}

async function savePoint(btn, params, label) {
  btn.disabled = true;
  btn.textContent = '設定中…';

  try {
    const result = await api('savePunchPointByLine', { idToken: idToken, params: params });

    document.getElementById('setup-hint').textContent =
      result.店名 + ' 的「' + result.名稱 + '」已' + (result.新增 ? '新增' : '更新') +
      '，半徑 ' + result.允許半徑 + ' 公尺';

    await refreshSetupList();

  } catch (err) {
    document.getElementById('setup-hint').textContent = err.message;
    btn.disabled = false;
    btn.textContent = label;
  }
}

/**
 * 餘額卡片只顯示特休，所有身分一視同仁（含店長與最高權限）。
 *
 * 病假、事假、生理假看到剩餘數字容易被當成「可以用掉的福利」。
 * 特休是真的屬於他的，其他是有事才請。
 *
 * 額度在後端照樣計算、超額一樣擋，後台也查得到，只是員工端不顯示。
 */
function renderLeaveBalance(balances) {
  const tracked = (balances || []).filter(function (b) {
    return b.假別代碼 === '特休' && b.剩餘時數 !== null;
  });

  document.getElementById('leave-balance').innerHTML = tracked.length
    ? tracked.map(function (b) {
        // 用假別代碼當標題（特休、病假），不用全名（特別休假、普通傷病假）——
        // 全名在四格並排的手機版面會折行，把數字擠歪
        // 生理假是每月重算的，不寫清楚會被當成年度額度
        // 週年制：寫出這一期什麼時候到期，到期沒休完會折現
        const unit = b.期間迄
          ? '天可用・' + b.期間迄.replace(/-/g, '/') + ' 前休完'
          : (b.說明 || '天可用');
        return '<div><div class="k">' + esc(b.假別代碼 || b.名稱) + '</div>' +
          '<div class="v">' + formatDays(b.剩餘天數) + '</div>' +
          '<div class="k">' + esc(unit) + '</div></div>';
      }).join('')
    : '';
}

/**
 * 天數顯示。整數不帶小數點，請過半天顯示 14.5，
 * 請過零頭小時才會出現 14.75——照實給，不修飾成看起來整齊的數字。
 */
function formatDays(days) {
  return String(Math.round((Number(days) || 0) * 100) / 100);
}

function renderLeaveTypes(types) {
  document.getElementById('lv-type').innerHTML = (types || []).map(function (t) {
    return '<option value="' + esc(t.假別代碼) + '">' + esc(t.名稱) + '</option>';
  }).join('');
}

function renderMyLeaves(leaves) {
  const log = document.getElementById('leave-log');

  if (!leaves || !leaves.length) {
    log.innerHTML = '<div class="empty">今年還沒有送過假單</div>';
    return;
  }

  log.innerHTML = leaves.map(function (l) {
    const range = l.開始時間.slice(5, 16).replace('T', ' ') + ' → ' +
                  l.結束時間.slice(5, 16).replace('T', ' ');

    // 被退回的單要看得到原因，不然員工不知道要改什麼
    const note = l.狀態 === '已退回' && l.退回原因
      ? '<div class="d" style="grid-column:1/-1">退回原因：' + esc(l.退回原因) + '</div>'
      : '';

    return '<div class="log-row" style="grid-template-columns:1fr auto">' +
      '<div><div class="t">' + esc(l.假別) + ' · ' + l.時數 + ' 小時' +
        (l.臨時請假 ? ' <span class="tag warn">臨時</span>' : '') + '</div>' +
        '<div class="d">' + esc(range) + '</div></div>' +
      '<div class="leave-side">' +
        '<span class="tag ' + (LEAVE_TAG[l.狀態] || 'info') + '">' + esc(l.狀態) + '</span>' +
        (l.狀態 === '待審核'
          ? '<button class="withdraw-btn" data-id="' + esc(l.單號) + '">撤回</button>'
          : '') +
      '</div>' +
      note +
      '</div>';
  }).join('');
}

// 待審核的單可以自己撤回；核准後要找店長作廢
document.getElementById('leave-log').addEventListener('click', async function (e) {
  const btn = e.target.closest('.withdraw-btn');
  if (!btn) return;
  if (!confirm('確定要撤回這張假單嗎？撤回後如果還要請，需要重新送一張。')) return;

  btn.disabled = true;
  btn.textContent = '撤回中…';
  try {
    await api('withdrawLeave', { idToken: idToken, leaveId: btn.dataset.id });
    showLeaveMsg('已撤回', false);
    leaveData = await api('getLeaveFormData', { idToken: idToken });
    renderLeaveBalance(leaveData.餘額);
    renderMyLeaves(leaveData.假單);
  } catch (err) {
    showLeaveMsg(err.message, true);
    btn.disabled = false;
    btn.textContent = '撤回';
  }
});

function showLeaveMsg(text, isError) {
  const el = document.getElementById('lv-msg');
  if (!text) { el.style.display = 'none'; return; }
  el.textContent = text;
  el.style.display = '';
  el.className = isError ? 'msg error' : 'msg ok';
}

let leaveMode = 'full';

document.getElementById('lv-mode').addEventListener('click', function (e) {
  const btn = e.target.closest('button');
  if (!btn) return;

  leaveMode = btn.dataset.mode;
  this.querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('active', b === btn);
  });
  document.getElementById('lv-full').style.display = leaveMode === 'full' ? '' : 'none';
  document.getElementById('lv-partial').style.display = leaveMode === 'full' ? 'none' : '';
});

document.getElementById('lv-submit').addEventListener('click', async function () {
  const btn = this;

  let start, end;
  if (leaveMode === 'full') {
    start = document.getElementById('lv-date-start').value;
    end = document.getElementById('lv-date-end').value;
    if (!start || !end) { showLeaveMsg('請選擇開始與結束日期', true); return; }
    if (end < start) { showLeaveMsg('結束日期不能早於開始日期', true); return; }
  } else {
    start = document.getElementById('lv-start').value.replace('T', ' ');
    end = document.getElementById('lv-end').value.replace('T', ' ');
    if (!start || !end) { showLeaveMsg('請選擇開始與結束時間', true); return; }
    if (end <= start) { showLeaveMsg('結束時間要晚於開始時間', true); return; }
  }

  btn.disabled = true;
  btn.textContent = '送出中…';
  showLeaveMsg('');

  try {
    const result = await api('submitLeave', {
      idToken: idToken,
      params: {
        假別: document.getElementById('lv-type').value,
        開始時間: start,
        結束時間: end,
        全天: leaveMode === 'full',
        事由: document.getElementById('lv-reason').value.trim(),
      },
    });

    showLeaveMsg(result.訊息 + '（' + result.時數 + ' 小時）', false);
    document.getElementById('lv-reason').value = '';

    leaveData = await api('getLeaveFormData', { idToken: idToken });
    renderLeaveBalance(leaveData.餘額);
    renderMyLeaves(leaveData.假單);

  } catch (err) {
    showLeaveMsg(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '送出假單';
  }
});

// ─────────────────────────────────────────────
// 註冊
// ─────────────────────────────────────────────
async function loadRegisterScreen(token) {
  const info = await api('getInviteInfo', { token: token });

  document.getElementById('reg-name').textContent = info.姓名;
  document.getElementById('reg-store').textContent = info.店名;
  document.getElementById('reg-role').textContent = info.角色;

  if (info.需要設定帳密) {
    document.getElementById('reg-credentials').style.display = 'flex';
  }

  // 已註冊的主管拿到的是「設定後台帳密」連結，不是註冊連結。
  // 畫面沿用註冊頁，只換文字與送出的動作。
  const forCredential = info.用途 === '設定帳密';
  const submitLabel = forCredential ? '確認，設定帳密' : '確認，完成註冊';
  if (forCredential) {
    document.querySelector('#screen-register .header .name').textContent =
      info.目前帳號 ? '重設後台密碼' : '設定後台帳密';
    document.querySelector('#screen-register .header .sub').textContent =
      '設定完成後，就能用電腦登入管理後台';
    document.getElementById('reg-account').value = info.目前帳號 || '';
    document.getElementById('reg-submit').textContent = submitLabel;
  }

  document.getElementById('reg-submit').onclick = async function () {
    const btn = this;
    const errEl = document.getElementById('reg-error');
    btn.disabled = true;
    btn.textContent = forCredential ? '設定中…' : '註冊中…';
    errEl.style.display = 'none';

    try {
      const credentials = info.需要設定帳密 ? {
        帳號: document.getElementById('reg-account').value.trim(),
        密碼: document.getElementById('reg-password').value,
      } : null;

      const result = await api(forCredential ? 'completeCredentialSetup' : 'completeRegistration', {
        token: token,
        idToken: idToken,
        credentials: credentials,
      });

      document.getElementById('result-icon').textContent = '✓';
      document.getElementById('result-time').textContent = '';
      if (forCredential) {
        document.getElementById('result-type').textContent = result.重設 ? '密碼已重設' : '帳密設定完成';
        document.getElementById('result-msg').textContent =
          '請用電腦開啟 ' + CONFIG.ADMIN_URL + '，以帳號「' + result.帳號 + '」登入後台。';
      } else {
        document.getElementById('result-type').textContent = '註冊完成';
        document.getElementById('result-msg').textContent =
          info.姓名 + '，你已經可以開始打卡了。之後從 LINE 的選單進入即可。';
      }
      document.getElementById('result-hours').style.display = 'none';
      document.getElementById('result-back').textContent = '開始使用';
      show('result');

    } catch (err) {
      errEl.innerHTML = '<div class="error-box"><div class="t">' +
        (forCredential ? '設定失敗' : '註冊失敗') + '</div>' +
        '<div class="d">' + err.message + '</div></div>';
      errEl.style.display = '';
      btn.disabled = false;
      btn.textContent = submitLabel;
    }
  };

  show('register');
}

// ─────────────────────────────────────────────
// 啟動
// ─────────────────────────────────────────────
async function main() {
  const setText = function (t) { document.getElementById('loading-text').textContent = t; };

  if (CONFIG.LIFF_ID.indexOf('請填入') === 0 || CONFIG.API_URL.indexOf('請填入') === 0) {
    showError('尚未完成設定', '這個頁面的 LIFF ID 或後端網址還沒填入，請聯繫系統管理者。');
    return;
  }

  try {
    setText('連線中…');
    await liff.init({ liffId: CONFIG.LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    setText('檢查版本…');
    if (await ensureLatestPage()) return;

    idToken = liff.getIDToken();
    if (!idToken) {
      showError('無法取得身分', '請完全關閉 LINE 後重新開啟，再從選單進入打卡頁。');
      return;
    }

    const inviteToken = new URLSearchParams(location.search).get('token');

    if (inviteToken) {
      setText('讀取註冊資料…');
      await loadRegisterScreen(inviteToken);
    } else {
      setText('讀取資料…');
      await loadPunchScreen();

      // 預覽模式：網址加 ?omikuji=1 直接看今天的籤，不定位、不打卡、不留紀錄
      if (new URLSearchParams(location.search).get('omikuji') === '1') showOmikuji(lastContext);
    }

  } catch (err) {
    if (err.code === 'NOT_REGISTERED') {
      showError('尚未註冊', '這個 LINE 帳號還沒有完成員工註冊，請向主管索取註冊連結。');
    } else if (err.code === 'DISABLED') {
      showError('帳號已停用', '此帳號目前為停用狀態，如有疑問請聯繫主管。');
    } else {
      showError('無法載入', err.message || '請稍後再試一次。');
    }
  }
}

// 事件綁定
document.getElementById('punch-btn').addEventListener('click', doPunch);
document.getElementById('result-back').addEventListener('click', function () {
  document.getElementById('result-back').textContent = '回打卡頁';
  loadPunchScreen().catch(function (err) {
    showError('無法載入', err.message);
  });
});
document.getElementById('error-retry').addEventListener('click', function () {
  location.reload();
});
document.getElementById('setup-entry').addEventListener('click', loadSetupScreen);

// 開啟請假通知：拿綁定碼 → 跳到官方帳號聊天室、訊息已填好，店長按送出就完成
document.getElementById('notify-btn').addEventListener('click', async function () {
  const btn = this;
  const codeBox = document.getElementById('notify-code');
  btn.disabled = true;
  btn.textContent = '產生綁定碼…';
  try {
    const r = await api('createNotifyBindCode', { idToken: idToken });
    const text = '綁定 ' + r.綁定碼;
    codeBox.textContent = '請在 CITYGO 聊天室按送出「' + text + '」（' + r.有效分鐘 +
      ' 分鐘內有效）。若沒有自動帶入，手動傳這段文字也可以。';
    codeBox.style.display = '';
    btn.textContent = '🔔 重新產生綁定碼';
    location.href = 'https://line.me/R/oaMessage/' + encodeURIComponent(CONFIG.OA_ID) +
      '/?' + encodeURIComponent(text);
  } catch (err) {
    codeBox.textContent = err.message;
    codeBox.style.display = '';
    btn.textContent = '🔔 開啟請假通知';
  } finally {
    btn.disabled = false;
  }
});
document.getElementById('setup-back').addEventListener('click', function () {
  loadPunchScreen().catch(function (err) { showError('無法載入', err.message); });
});
document.getElementById('tabs').addEventListener('click', function (e) {
  const btn = e.target.closest('button');
  if (!btn) return;

  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.classList.toggle('active', b === btn);
  });

  if (btn.dataset.tab === 'punch') {
    loadPunchScreen().catch(function (err) { showError('無法載入', err.message); });
  } else if (btn.dataset.tab === 'leave') {
    loadLeaveScreen();
  } else if (btn.dataset.tab === 'shifts') {
    loadMyShifts();
  } else {
    loadRecords();
  }
});

main();
</script>
